buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

repositories {
    mavenCentral()
    maven { url = 'https://files.minecraftforge.net/maven' }
}

version = '1.0.0'
group = 'com.modkalogger'
archivesBaseName = 'modkalogger'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.level', 'debug'
            mods {
                modkalogger {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.level', 'debug'
            mods {
                modkalogger {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'
    implementation 'org.ow2.asm:asm:9.2'
    implementation 'org.ow2.asm:asm-commons:9.2'
    implementation 'org.javassist:javassist:3.29.2-GA'
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'net.java.dev.jna:jna-platform:5.13.0'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "modkalogger",
            "Specification-Vendor": "modkalogger",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"modkalogger",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "Premain-Class": "com.modkalogger.asm.ClassLoaderHook",
            "Can-Retransform-Classes": "true",
            "Can-Set-Native-Method-Prefix": "true"
        ])
    }
}

processResources {
}

// Задача для компиляции инжектора
task compileInjector(type: JavaCompile) {
    source = file('EnhancedInjector.java')
    destinationDirectory = file('build/injector')
    classpath = configurations.compileClasspath
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs = ['-source', '1.8', '-target', '1.8']
}

// Задача для запуска инжектора
task inject(dependsOn: [build, compileInjector], type: JavaExec) {
    classpath = files('build/injector') + configurations.compileClasspath
    main = 'EnhancedInjector'
    
    // Аргументы по умолчанию
    if (project.hasProperty('inputJar')) {
        args project.property('inputJar')
    } else {
        args 'ias.jar'
    }
    
    if (project.hasProperty('outputJar')) {
        args project.property('outputJar')
    } else {
        args 'ias_injected.jar'
    }
}

// Быстрая задача для инъекции
task quickInject(dependsOn: [build], type: JavaExec) {
    classpath = sourceSets.main.compileClasspath
    main = 'EnhancedInjector'
    args 'ias.jar', 'ias_injected.jar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
